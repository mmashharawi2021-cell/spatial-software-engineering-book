name: CI
on:
  push:
  pull_request:

jobs:
  python-and-postgis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: geosmart
          POSTGRES_USER: geosmart
          POSTGRES_PASSWORD: geosmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geosmart -d geosmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://geosmart:geosmart@localhost:5432/geosmart
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest PyYAML geopandas==1.1.4 shapely==2.1.2 pyproj==3.7.2
      - name: Python, Skills, Agents, MCP and code-block checks
        run: |
          python -m compileall -q api python tests skills agents mcp
          find book -path '*/examples/*.py' -print0 | xargs -0 -r python -m py_compile
          python tests/verify_code_block_manifest.py
          pytest -q
          python python/validate_features.py
          python python/etl.py
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Database migration and smoke tests
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/001_init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed/001_seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/001_smoke.sql
      - name: API integration tests
        run: |
          (cd api && uvicorn app:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1) &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              cat uvicorn.log
              exit 1
            fi
            sleep 1
          done
          python tests/api_integration.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  dart-code-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Parse and format-check illustrative Dart block
        run: dart format --output=none book/appendices/examples/CB-036.dart
