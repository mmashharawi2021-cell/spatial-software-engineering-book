name: Generate web lockfile
on:
  push:
    branches: [release-blockers-v1]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-blockers-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile
        working-directory: web
        run: npm install --package-lock-only
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "Generate npm package-lock for reproducible builds"
            git push origin HEAD:release-blockers-v1
          fi
